# /etc/nginx/conf.d/edusathi-upstream.conf: instances share one database, so any instance can serve any request
# (sessions live in Postgres; the chat hub LISTENs on Postgres in every instance).
upstream edusathi_app {
    least_conn;
    server 127.0.0.1:3040 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:3041 max_fails=2 fail_timeout=10s;
    keepalive 16;
}
