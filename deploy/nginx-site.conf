# Locations for /etc/nginx/sites-enabled/edusathi.tech (TLS lines are added by certbot).
# Next.js sends Strict-Transport-Security itself, so nginx must not add a second one.
location = /api/chat/stream {                # server-sent events: never buffer, allow long-lived connections
    proxy_pass http://edusathi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_next_upstream off;
}
location / {
    proxy_pass http://edusathi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";          # required for upstream keepalive
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503;   # retry the other instance (never re-sends POSTs)
}
